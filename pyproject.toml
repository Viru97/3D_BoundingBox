[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bbox3d"
version = "0.1.0"
description = "Mask-guided 3D bounding box regression for RGB-D point clouds"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
viz = [
    "plotly>=5.15.0",
    "matplotlib>=3.7.0",
]
export = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
]
all = [
    "plotly>=5.15.0",
    "matplotlib>=3.7.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
]
dev = [
    "build>=1.2.0",
    "matplotlib>=3.7.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "plotly>=5.15.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Repository = "https://github.com/Viru97/3D_BoundingBox"
Issues = "https://github.com/Viru97/3D_BoundingBox/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
